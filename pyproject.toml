[project]
name = "devpost-vibe-check"
version = "0.1.0"
requires-python = ">=3.11"
description = "Rank Devpost submissions by suspicious git history"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["vibe_check", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
