name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check vibe_check tests

      - name: Import package
        run: python -c "import vibe_check; print(vibe_check.__version__)"

      - name: CLI help
        run: python -m vibe_check --help

      - name: Unit tests
        run: pytest -q
