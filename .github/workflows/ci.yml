name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    # Pin image so ubuntu-latest → 26.04 migration does not surprise CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check vibe_check tests

      - name: Import package
        run: python -c "import vibe_check; print(vibe_check.__version__)"

      - name: CLI help
        run: python -m vibe_check --help

      - name: Unit tests
        run: pytest -q
